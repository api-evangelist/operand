name: Operand
description: >-
  Operand is an AI-enabled pricing and commercial strategy platform for consumer
  retail, founded in 2024 and backed by Felicis, Y Combinator, SV Angel, and Soma
  Capital. It applies proprietary AI systems — an autonomous "agent swarm" — to set
  pricing and promotion strategy for mid-market and enterprise brands and retailers
  managing thousands of SKUs, volatile demand, and thin margins, running simulations
  to benchmark margin, revenue, and inventory-turn objectives before automating price
  changes. Operand is delivered as a managed platform with expert support and
  request-a-quote pricing rather than a public developer API; it currently publishes
  no OpenAPI, developer portal, or self-serve SDKs. An earlier Operand product at
  operand.ai offered an embeddings / semantic-search API with Python, Go, and
  TypeScript SDKs, now discontinued.
